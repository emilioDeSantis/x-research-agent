<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Research Agent</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root {
  --bg: #fafaf9; --panel: #ffffff; --ink: #1c1917; --muted: #78716c; --line: #e7e5e4;
  --accent: #2563eb; --accent-ink: #fff; --soft: #f5f5f4; --err: #dc2626; --ok: #16a34a;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0c0a09; --panel: #1c1917; --ink: #f5f5f4; --muted: #a8a29e; --line: #292524;
          --accent: #60a5fa; --accent-ink: #0c0a09; --soft: #231f1d; --err: #f87171; --ok: #4ade80; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
.app { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
aside { border-right: 1px solid var(--line); padding: 16px; background: var(--panel); overflow-y: auto; max-height: 100vh; position: sticky; top: 0; }
aside h1 { font-size: 15px; margin: 0 0 4px; }
.keys { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
.keys span { margin-right: 8px; }
.keys .on { color: var(--ok); } .keys .off { color: var(--err); }
.new { width: 100%; padding: 8px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); border-radius: 8px; cursor: pointer; margin-bottom: 12px; font: inherit; }
.hist a { display: block; padding: 8px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 13px; margin-bottom: 2px; }
.hist a:hover, .hist a.active { background: var(--soft); }
.hist small { display: block; color: var(--muted); font-size: 11px; }
main { padding: 32px 40px; max-width: 900px; width: 100%; }
form textarea { width: 100%; min-height: 96px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); font: inherit; resize: vertical; }
.row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg label { padding: 6px 12px; cursor: pointer; font-size: 13px; }
.seg input { display: none; }
.seg input:checked + span { color: var(--accent); font-weight: 600; }
.budget { font-size: 13px; color: var(--muted); margin-left: auto; }
.budget input { width: 64px; padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); font: inherit; }
button.go { padding: 8px 18px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; cursor: pointer; }
button.go:disabled { opacity: .5; cursor: default; }
.q { font-size: 20px; font-weight: 650; margin: 0 0 6px; }
.meta { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
details.log { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); margin-bottom: 24px; }
details.log summary { padding: 10px 14px; cursor: pointer; font-size: 13px; color: var(--muted); }
.events { max-height: 420px; overflow-y: auto; padding: 0 14px 12px; font-size: 13px; }
.ev { padding: 4px 0; border-top: 1px dashed var(--line); word-break: break-word; }
.ev .who { color: var(--accent); font-weight: 600; margin-right: 6px; }
.ev .tool { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.ev .think { color: var(--muted); font-style: italic; white-space: pre-wrap; }
.ev.err { color: var(--err); }
.spinner { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 6px; vertical-align: -1px; }
@keyframes spin { to { transform: rotate(360deg); } }
.report { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 28px 20px; }
.report a { color: var(--accent); }
.report h1, .report h2 { margin-top: 1.4em; } .report h2 { font-size: 18px; } .report h3 { font-size: 15px; }
.report blockquote { margin: 8px 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
.report code { background: var(--soft); padding: 1px 4px; border-radius: 4px; }
.empty { color: var(--muted); margin-top: 40px; }
.share { margin: 0 0 10px; font-size: 13px; } .share a { color: var(--accent); }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  aside { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
  main { padding: 20px 16px; }
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>X Research Agent</h1>
    <div class="keys" id="keys"></div>
    <button class="new" onclick="newQuestion()">+ New question</button>
    <div class="hist" id="hist"></div>
  </aside>
  <main id="main"></main>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let source = null, currentId = null;

async function loadStatus() {
  const s = await (await fetch("/api/status")).json();
  const k = (on, label) => `<span class="${on ? "on" : "off"}">${on ? "●" : "○"} ${label}</span>`;
  $("#keys").innerHTML = k(s.anthropic, "Claude") + k(s.xai, "Grok X search") + k(s.x_api, "X API");
}

async function loadHistory() {
  const runs = await (await fetch("/api/runs")).json();
  $("#hist").innerHTML = runs.map((r) => `
    <a href="#${r.id}" class="${r.id === currentId ? "active" : ""}">
      ${esc(r.question.slice(0, 90))}
      <small>${new Date(r.created_at * 1000).toLocaleString()} · ${r.depth} · ${r.status}${r.cost ? " · $" + r.cost.usd.toFixed(2) : ""}</small>
    </a>`).join("");
}

function newQuestion() {
  if (source) source.close();
  currentId = null;
  history.replaceState(null, "", "/");
  $("#main").innerHTML = `
    <form id="f">
      <textarea id="question" placeholder="What do you want to know? e.g. What's the state of open-weight coding models this month?" autofocus></textarea>
      <div class="row">
        <div class="seg">
          ${["quick", "deep", "max"].map((d) => `<label><input type="radio" name="depth" value="${d}" ${d === "deep" ? "checked" : ""}><span>${d}</span></label>`).join("")}
        </div>
        <label class="budget">Budget $<input id="budget" type="number" min="0.5" step="0.5" placeholder="auto"></label>
        <button class="go" type="submit">Research</button>
      </div>
    </form>
    <p class="empty">Quick ≈ a couple of minutes, ≤$1.50. Deep sends parallel workers across X and the web, ≤$10. Max is exhaustive, ≤$30.</p>`;
  $("#question").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("#f").requestSubmit(); });
  $("#f").onsubmit = async (e) => {
    e.preventDefault();
    const question = $("#question").value.trim();
    if (!question) return;
    e.submitter && (e.submitter.disabled = true);
    const depth = document.querySelector("input[name=depth]:checked").value;
    const { id } = await (await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question, depth, budget: parseFloat($("#budget").value) || null }) })).json();
    location.hash = id;
  };
  loadHistory();
}

function renderEvent(ev) {
  const who = ev.agent ? `<span class="who">${esc(ev.agent)}</span>` : "";
  switch (ev.type) {
    case "tool": {
      const inp = ev.input || {};
      const arg = inp.query || inp.url || inp.username || inp.tweet_id || (inp.tasks ? inp.tasks.map((t) => t.title).join(", ") : JSON.stringify(inp));
      return `<div class="ev">${who}<span class="tool">${esc(ev.name)}</span> ${esc(String(arg).slice(0, 220))}</div>`;
    }
    case "tool_done":
      return ev.error ? `<div class="ev err">${who}${esc(ev.name)} failed: ${esc(ev.preview)}</div>` : "";
    case "thinking":
      return `<div class="ev">${who}<span class="think">${esc(ev.text.slice(0, 600))}</span></div>`;
    case "worker_start":
      return `<div class="ev">${who}started: ${esc(ev.brief.slice(0, 240))}</div>`;
    case "worker_done":
      return `<div class="ev">${who}finished (${ev.notes.length.toLocaleString()} chars of notes)</div>`;
    case "shared":
      return `<div class="ev">Saved to the shared GitHub repo: ${esc(ev.path)}</div>`;
    case "error":
      return `<div class="ev err">Error: ${esc(ev.message)}</div>`;
    default:
      return "";
  }
}

function costLine(c) {
  if (!c) return "";
  const parts = [`$${c.usd.toFixed(2)}` + (c.budget ? ` of $${c.budget.toFixed(0)} budget` : "")];
  if (c.grok.posts) parts.push(`${c.grok.posts} posts via Grok`);
  if (c.x_api.posts) parts.push(`${c.x_api.posts} posts via X API`);
  if (c.web_searches) parts.push(`${c.web_searches} web searches`);
  return parts.join(" · ");
}

function showReport(md) {
  $("#report").innerHTML = `<p class="share"><a href="/runs/${currentId}/share" target="_blank" rel="noopener">Open as shareable page ↗</a></p><div class="report">${marked.parse(md)}</div>`;
}

async function openRun(id) {
  if (source) source.close();
  currentId = id;
  const r = await (await fetch(`/api/runs/${id}`)).json();
  $("#main").innerHTML = `
    <div class="q">${esc(r.question)}</div>
    <div class="meta" id="meta"></div>
    ${r.status === "running" ? `<button class="new" id="cancel" style="width:auto">Stop this run</button>` : ""}
    <details class="log" ${r.status === "running" ? "open" : ""}><summary id="logsum"></summary><div class="events" id="events"></div></details>
    <div id="report"></div>`;
  let cost = r.cost, status = r.status, n = 0;
  const events = $("#events");
  const update = () => {
    $("#meta").innerHTML = (status === "running" ? '<span class="spinner"></span>researching · ' : status + " · ") + r.depth + " · " + costLine(cost);
    $("#logsum").textContent = `Research log (${n} events)`;
  };
  const add = (ev) => {
    n++;
    if (ev.cost) cost = ev.cost;
    const html = renderEvent(ev);
    if (html) {
      const stick = events.scrollTop + events.clientHeight >= events.scrollHeight - 20;
      events.insertAdjacentHTML("beforeend", html);
      if (stick) events.scrollTop = events.scrollHeight;
    }
    if (ev.type === "report") showReport(ev.markdown);
    if (ev.type === "end") { status = ev.status; loadHistory(); $("#cancel")?.remove(); }
    update();
  };
  const cancelBtn = $("#cancel");
  if (cancelBtn) cancelBtn.onclick = async () => { cancelBtn.disabled = true; await fetch(`/api/runs/${id}/cancel`, { method: "POST" }); };
  r.events.forEach(add);
  if (r.report && !r.events.some((e) => e.type === "report")) showReport(r.report);
  update();
  loadHistory();
  if (status === "running") {
    source = new EventSource(`/api/runs/${id}/stream?after=${r.events.length}`);
    source.onmessage = (m) => add(JSON.parse(m.data));
    source.onerror = () => { source.close(); };
  }
}

function route() {
  const id = location.hash.slice(1);
  id ? openRun(id) : newQuestion();
}
window.addEventListener("hashchange", route);
document.addEventListener("click", (e) => { const a = e.target.closest(".report a"); if (a) a.target = "_blank"; });
loadStatus();
route();
</script>
</body>
</html>
